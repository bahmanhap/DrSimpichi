name: Telegram Raw Sync

on:
  schedule:
    - cron: '0 */24 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegram-raw-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: github/requirements.txt

      - name: Install dependencies
        run: pip install -r github/requirements.txt

      - name: Read new Telegram posts
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          CHANNEL_USERNAME: moshakhsatmotor
        run: python github/scripts/telegram_reader.py

      - name: Commit raw data and sync state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github/data/raw_posts.json github/data/sync_state.json
          git diff --cached --quiet || git commit -m "chore: sync raw Telegram posts"
          git push
