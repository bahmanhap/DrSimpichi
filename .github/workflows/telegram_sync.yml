name: Telegram Sync

on:
  workflow_dispatch:

  schedule:
    # اجرای خودکار هر 24 ساعت
    - cron: "0 0 * * *"


permissions:
  contents: write


jobs:

  telegram-sync:

    runs-on: ubuntu-latest


    steps:

      # دریافت فایل‌های Repository
      - name: Checkout repository
        uses: actions/checkout@v4


      # نصب Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # نصب Telethon
      - name: Install dependencies
        run: |
          pip install telethon


      # اجرای اسکریپت دریافت تلگرام
      - name: Run Telegram Reader

        env:

          # مطابق telegram_reader.py
          TELEGRAM_API_ID: ${{ secrets.API_ID }}

          TELEGRAM_API_HASH: ${{ secrets.API_HASH }}

          CHANNEL_USERNAME: ${{ secrets.CHANNEL_USERNAME }}

          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}


        run: |
          python scripts/telegram_reader.py


      # ذخیره فایل‌های بروزرسانی شده
      - name: Commit updated data

        run: |

          git config --global user.name "github-actions"

          git config --global user.email "github-actions@github.com"


          git add data/raw_posts.json

          git add data/sync_state.json


          git commit -m "Update Telegram raw posts" || echo "No changes"


          git push
