name: Telegram Sync

on:
  workflow_dispatch:

  schedule:
    - cron: "0 0 * * *"


permissions:
  contents: write


jobs:

  telegram-sync:

    runs-on: ubuntu-latest


    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      - name: Install dependencies
        run: |
          pip install telethon


      - name: Restore Telegram Session File
        env:
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
        run: |
          echo "$TELEGRAM_SESSION" | base64 --decode > telegram_session.session


      - name: Run Telegram Reader
        env:
          TELEGRAM_API_ID: ${{ secrets.API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.API_HASH }}
          CHANNEL_USERNAME: ${{ secrets.CHANNEL_USERNAME }}

          # اضافه شد برای اسکریپت فعلی
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}

        run: |
          python scripts/telegram_reader.py


      - name: Commit updated data
        run: |

          git config --global user.name "github-actions"

          git config --global user.email "github-actions@github.com"

          git add data/raw_posts.json

          git add data/sync_state.json

          git commit -m "Update Telegram raw posts" || echo "No changes"

          git push
