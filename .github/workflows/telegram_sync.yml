name: Telegram Sync

on:
  workflow_dispatch:

  schedule:
    # هر 24 ساعت
    - cron: "0 0 * * *"


permissions:
  contents: write


jobs:

  telegram-sync:

    runs-on: ubuntu-latest


    steps:

      # دریافت سورس گیت‌هاب
      - name: Checkout repository
        uses: actions/checkout@v4


      # نصب Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # نصب کتابخانه‌ها
      - name: Install dependencies
        run: |
          pip install telethon


      # ساخت فایل Session تلگرام
      - name: Restore Telegram Session
        env:
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
        run: |
          echo "$TELEGRAM_SESSION" | base64 --decode > telegram_session.session


      # اجرای دریافت پست‌های تلگرام
      - name: Run Telegram Reader
        env:

          # نام‌ها مطابق telegram_reader.py
          TELEGRAM_API_ID: ${{ secrets.API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.API_HASH }}
          CHANNEL_USERNAME: ${{ secrets.CHANNEL_USERNAME }}

        run: |
          python scripts/telegram_reader.py


      # ذخیره تغییرات JSON
      - name: Commit updated posts

        run: |

          git config --global user.name "github-actions"

          git config --global user.email "github-actions@github.com"


          git add data/raw_posts.json

          git add data/sync_state.json


          git commit -m "Update Telegram raw posts" || echo "No changes"


          git push
